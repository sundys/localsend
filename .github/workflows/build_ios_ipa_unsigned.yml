name: Build iOS IPA (unsigned, arm64)

# Builds an unsigned, arm64-only IPA for TrollStore installation on iOS 14 and
# publishes it as a GitHub Release (the release notes contain the version info,
# the change summary and the bundle checks).
#
# Why Flutter 3.41.9 and not the version pinned in .fvmrc?
# Flutter >= 3.47 ships an engine built with `ios_deployment_target = "15.0"`
# (engine/src/build/config/darwin/darwin_sdk.gni), so every app built with it
# declares MinimumOSVersion 15.0. iOS 14 refuses to load such binaries and the
# share extension is never registered with the share sheet.
# 3.41.9 is the last release whose engine still targets iOS 13.0, which is what
# LocalSend v1.18.2 (the last version supporting iOS 13/14) was built with.

on:
  workflow_dispatch:
  push:
    branches:
      - ios14-support

permissions:
  contents: write

concurrency:
  group: ios14-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build_ipa:
    runs-on: macos-26

    steps:
      # fetch-depth: 0 keeps the history and the tags so the release notes can
      # list the commits since the previous iOS release.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+.*/\1/p' app/pubspec.yaml)
          BUILD_NUMBER=$(sed -n 's/^version: [0-9]*\.[0-9]*\.[0-9]*+\([0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          # One rolling release per version: every build moves this tag to the new
          # commit and replaces the asset, so the Releases page stays tidy.
          echo "tag=ios14-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building LocalSend $VERSION ($BUILD_NUMBER)"

      # The pinned plugins are from late 2026 and already use iOS 26 SDK APIs
      # (e.g. connectivity_plus 7.3.1 calls NWPath.isUltraConstrained, which does
      # not exist in the iOS 18 SDK of Xcode 16.x), so the build needs the iOS 26
      # SDK. A deployment target below 15 is only a warning in Xcode 26; Xcode 27
      # turns that into an error, which is why the version is pinned.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      # Caches the Flutter SDK and the pub cache between runs.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile default
          rustup target add aarch64-apple-ios --toolchain 1.97.1
          rustup show
          xcodebuild -version

      # The Rust library is the slowest part of a clean build and its artifacts
      # live in a stable directory (see CARGOKIT_TARGET_TEMP_DIR_OVERRIDE below),
      # so cargo can rebuild incrementally.
      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargokit_target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml', 'packages/localsend_isolates/rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      # TrollStore re-signs the app with ldid and keeps the entitlements it finds
      # in the existing signature. The share extension needs the app group
      # (UserDefaults(suiteName:) is force-unwrapped by share_handler), so sign
      # both binaries with their entitlements before packaging.
      - name: Install ldid
        run: brew install ldid

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS app (unsigned, arm64 only)
        working-directory: app
        env:
          # FLUTTER_XCODE_* variables are forwarded to xcodebuild as build settings.
          # ARCHS=arm64 keeps the build to the single device slice (no x86_64/arm64e).
          FLUTTER_XCODE_ARCHS: arm64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
          # The ShareExtension target does not include Generated.xcconfig, so its
          # Info.plist cannot resolve $(FLUTTER_BUILD_NAME)/$(FLUTTER_BUILD_NUMBER).
          # Passing them as build settings makes the extension version match the app.
          FLUTTER_XCODE_FLUTTER_BUILD_NAME: ${{ steps.app_version.outputs.version }}
          FLUTTER_XCODE_FLUTTER_BUILD_NUMBER: ${{ steps.app_version.outputs.build_number }}
          # Keep the cargo artifacts in a stable, cacheable directory instead of
          # Xcode's per-build TARGET_TEMP_DIR (read by cargokit/build_pod.sh).
          CARGOKIT_TARGET_TEMP_DIR_OVERRIDE: ${{ github.workspace }}/.cargokit_target
        run: flutter build ios --release --no-codesign

      - name: Verify and package unsigned IPA
        id: package
        working-directory: app
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          BUILD_NUMBER: ${{ steps.app_version.outputs.build_number }}
        run: |
          set -euo pipefail

          APP_DIR="build/ios/iphoneos/Runner.app"
          APPEX_DIR="$APP_DIR/PlugIns/ShareExtension.appex"
          IPA="LocalSend-$VERSION-ios-arm64-unsigned.ipa"

          test -d "$APP_DIR" || { echo "::error::Runner.app was not built"; exit 1; }
          test -d "$APPEX_DIR" || { echo "::error::ShareExtension.appex is not embedded"; exit 1; }

          # Keep the extension version in sync with the host app (iOS rejects
          # extensions whose version does not match the containing app).
          for plist in "$APP_DIR/Info.plist" "$APPEX_DIR/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$plist"
          done

          # This is the label iOS shows in the share sheet.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LocalSend" "$APPEX_DIR/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string LocalSend" "$APPEX_DIR/Info.plist"

          APP_MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_DIR/Info.plist")
          APPEX_MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APPEX_DIR/Info.plist")
          APPEX_POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX_DIR/Info.plist")
          APPEX_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APPEX_DIR/Info.plist")
          APPEX_RULE=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule" "$APPEX_DIR/Info.plist")
          APP_ARCHS=$(lipo -archs "$APP_DIR/Runner")
          APPEX_ARCHS=$(lipo -archs "$APPEX_DIR/ShareExtension")

          echo "--- Runner.app ---"
          echo "MinimumOSVersion: $APP_MIN_OS"
          echo "architectures:    $APP_ARCHS"
          echo "--- ShareExtension.appex ---"
          echo "MinimumOSVersion: $APPEX_MIN_OS"
          echo "architectures:    $APPEX_ARCHS"
          echo "display name:     $APPEX_NAME"
          echo "extension point:  $APPEX_POINT"
          echo "activation rule:  $APPEX_RULE"

          # Fail loudly instead of shipping an IPA that silently drops out of the
          # iOS 14 share sheet again.
          for min_os in "$APP_MIN_OS" "$APPEX_MIN_OS"; do
            awk -v min="$min_os" -v max="14.0" 'BEGIN { exit (min + 0 > max + 0) ? 1 : 0 }' \
              || { echo "::error::Bundle requires iOS $min_os, which is newer than iOS 14.0"; exit 1; }
          done
          [ "$APPEX_POINT" = "com.apple.share-services" ] \
            || { echo "::error::Unexpected extension point: $APPEX_POINT"; exit 1; }
          # The dictionary form of NSExtensionActivationRule hides the extension when
          # a share provides an item type the dictionary does not cover (screenshots
          # do), so the build must ship the predicate form.
          echo "$APPEX_RULE" | grep -q 'UTI-CONFORMS-TO "public.image"' \
            || { echo "::error::Share extension activation rule is not the expected predicate: $APPEX_RULE"; exit 1; }
          [ "$APP_ARCHS" = "arm64" ] && [ "$APPEX_ARCHS" = "arm64" ] \
            || { echo "::error::Expected arm64-only binaries, got app=$APP_ARCHS appex=$APPEX_ARCHS"; exit 1; }

          # Embed the app group (and multicast) entitlements. TrollStore preserves
          # the entitlements of the signature it re-signs.
          ldid -S"$GITHUB_WORKSPACE/app/ios/Runner/Runner.entitlements" "$APP_DIR/Runner"
          ldid -S"$GITHUB_WORKSPACE/app/ios/ShareExtension/ShareExtension.entitlements" "$APPEX_DIR/ShareExtension"
          RUNNER_ENTS=$(ldid -e "$APP_DIR/Runner")
          APPEX_ENTS=$(ldid -e "$APPEX_DIR/ShareExtension")
          echo "$RUNNER_ENTS" | grep -q "group.org.localsend.localsendApp" \
            || { echo "::error::app group entitlement missing on Runner"; exit 1; }
          echo "$APPEX_ENTS" | grep -q "group.org.localsend.localsendApp" \
            || { echo "::error::app group entitlement missing on ShareExtension"; exit 1; }

          rm -rf Payload "$IPA"
          mkdir Payload
          cp -R "$APP_DIR" Payload/Runner.app
          zip -qry "$IPA" Payload
          unzip -l "$IPA" > ipa-contents.txt
          grep -q "PlugIns/ShareExtension.appex" ipa-contents.txt \
            || { echo "::error::ShareExtension.appex missing from the IPA"; exit 1; }

          IPA_SIZE=$(du -h "$IPA" | cut -f1 | tr -d ' ')
          IPA_SHA=$(shasum -a 256 "$IPA" | cut -d' ' -f1)
          ls -lh "$IPA"
          echo "size=$IPA_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$IPA_SHA" >> "$GITHUB_OUTPUT"
          echo "app_min_os=$APP_MIN_OS" >> "$GITHUB_OUTPUT"
          echo "appex_min_os=$APPEX_MIN_OS" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          BUILD_NUMBER: ${{ steps.app_version.outputs.build_number }}
          IPA_SIZE: ${{ steps.package.outputs.size }}
          IPA_SHA: ${{ steps.package.outputs.sha256 }}
          APP_MIN_OS: ${{ steps.package.outputs.app_min_os }}
          APPEX_MIN_OS: ${{ steps.package.outputs.appex_min_os }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 --match 'ios14-v*' HEAD 2>/dev/null || true)
          {
            echo "## LocalSend $VERSION ($BUILD_NUMBER) — iOS 14 支持版（未签名 / TrollStore）"
            echo
            echo "本构建用于在 **iOS 14 及以上**完整使用 LocalSend，包括系统分享菜单（分享到 LocalSend）。"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 安装包 | \`LocalSend-$VERSION-ios-arm64-unsigned.ipa\` ($IPA_SIZE) |"
            echo "| 架构 | arm64 |"
            echo "| 主 App 最低系统 | iOS $APP_MIN_OS |"
            echo "| 分享扩展最低系统 | iOS $APPEX_MIN_OS |"
            echo "| 工具链 | Flutter 3.41.9 + Xcode 26.6 |"
            echo "| 构建编号 | #${RUN_NUMBER} |"
            echo "| 提交 | \`${GITHUB_SHA:0:10}\` |"
            echo "| SHA-256 | \`$IPA_SHA\` |"
            echo
            echo "### 版本说明"
            echo
            echo "- 基于 LocalSend ${VERSION}，**未签名**，用 TrollStore 安装即可（无需 Apple 开发者账号）。"
            echo "- 修复 iOS 14 系统分享菜单里找不到 LocalSend 的问题：Flutter ≥ 3.47 的引擎最低要求 iOS 15，会把主 App 与分享扩展的 \`MinimumOSVersion\` 抬到 15.0，iOS 14 因此不会注册该分享扩展。本构建固定使用引擎最低 iOS 13.0 的 Flutter 3.41.9，并让分享扩展保持 14.0。"
            echo "- 分享菜单中的应用名从 \`ShareExtension\` 改为 **LocalSend**。"
            echo "- 修复从**截图预览**分享时分享菜单里没有 LocalSend 的问题：分享扩展的激活规则由字典式（只覆盖固定类型，且要求匹配分享内容里的每一个 item）改为 predicate（按 UTI 一致性匹配任意附件）。"
            echo "- 已写入 app group / multicast entitlements（分享回传与局域网发现需要）。"
            echo
            echo "### 修改摘要"
            echo
            if [ -n "$PREV_TAG" ] && git merge-base --is-ancestor "$PREV_TAG" HEAD 2>/dev/null; then
              echo "自 $PREV_TAG 以来："
              echo
              git log --pretty='- %s (`%h`)' "$PREV_TAG..HEAD"
            else
              echo "最近 10 个提交："
              echo
              git log --pretty='- %s (`%h`)' -10 HEAD
            fi
            echo
            echo "### 安装（TrollStore）"
            echo
            echo "1. 下载 \`LocalSend-$VERSION-ios-arm64-unsigned.ipa\`。"
            echo "2. TrollStore → 右上角 \`+\` → 选择该 IPA 安装。"
            echo "3. 首次启动后允许「本地网络」权限，再到系统分享菜单确认出现 **LocalSend**。"
            echo
            echo "### 构建校验"
            echo
            echo "- \`Runner.app\` MinimumOSVersion = ${APP_MIN_OS}，arm64。"
            echo "- \`ShareExtension.appex\` MinimumOSVersion = ${APPEX_MIN_OS}，arm64，\`NSExtensionPointIdentifier = com.apple.share-services\`。"
            echo "- 构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # The release tag is rolling, so point it at the commit that was just built.
      # The credentials persisted by actions/checkout are reused for the push.
      - name: Move the release tag to this build
        env:
          TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${TAG}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: LocalSend ${{ steps.app_version.outputs.version }} iOS 14 (arm64, unsigned)
          body_path: release-notes.md
          files: app/LocalSend-${{ steps.app_version.outputs.version }}-ios-arm64-unsigned.ipa
          prerelease: false
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
